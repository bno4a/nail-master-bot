services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nailbot
      POSTGRES_USER: nailbot
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nailbot -d nailbot"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nailbot
      DB_PASSWORD: ${DB_PASSWORD}
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_USERNAME: ${BOT_USERNAME}
      MASTER_TELEGRAM_ID: ${MASTER_TELEGRAM_ID}
      TZ: ${TZ}
    restart: unless-stopped

volumes:
  pgdata:
